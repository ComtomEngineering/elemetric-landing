<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Elemetric</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --font-body: "IBM Plex Sans", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
        --ink: #161616;
        --ink-muted: #525252;
        --border: #e0e0e0;
        --border-strong: #8d8d8d;
        --surface: #f4f4f4;
        --primary: #0f62fe;
        --primary-hover: #0353e9;
        --ok-bg: #defbe6;
        --ok-border: #a7f0ba;
        --ok-ink: #044317;
        --err-bg: #fff1f1;
        --err-border: #ffb3b8;
        --err-ink: #750e13;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 20px;
        color: var(--ink);
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .cf-wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .cf-intro {
        font-size: 13px;
        line-height: 19px;
        color: var(--ink-muted);
      }

      #cfForm {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .cf-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .cf-label {
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--ink-muted);
      }

      .cf-input,
      .cf-select,
      .cf-textarea {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 20px;
        padding: 10px 12px;
      }

      .cf-input::placeholder,
      .cf-textarea::placeholder {
        color: var(--border-strong);
      }

      .cf-input:focus,
      .cf-select:focus,
      .cf-textarea:focus {
        outline: none;
        background: #ffffff;
        border-color: var(--primary);
        box-shadow: 0 0 0 1px var(--primary);
      }

      .cf-textarea {
        resize: vertical;
        min-height: 108px;
      }

      /* Honeypot: hidden from humans, visible to naive bots */
      .cf-hp {
        position: absolute !important;
        left: -9999px !important;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .cf-submit {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: 4px;
        background: var(--primary);
        color: #ffffff;
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .cf-submit:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      .cf-submit:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .cf-status {
        display: none;
        padding: 10px 12px;
        border-radius: 4px;
        font-size: 13px;
        line-height: 18px;
      }

      .cf-status.visible {
        display: block;
      }

      .cf-status.err {
        background: var(--err-bg);
        border: 1px solid var(--err-border);
        color: var(--err-ink);
      }

      .cf-done {
        display: none;
        max-width: 560px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
        text-align: center;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      .cf-done.visible {
        display: flex;
      }

      .cf-done-icon {
        width: 44px;
        height: 44px;
        border-radius: 4px;
        background: var(--ok-bg);
        border: 1px solid var(--ok-border);
        color: var(--ok-ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
      }

      .cf-done h2 {
        font-size: 18px;
        font-weight: 600;
        color: var(--ink);
      }

      .cf-done p {
        font-size: 13px;
        color: var(--ink-muted);
        max-width: 380px;
      }
    </style>
  </head>
  <body>
    <div class="cf-wrap" id="cfWrap">
      <p class="cf-intro" id="cfIntro">
        ¿Dudas sobre los datos, acceso a la API o alguna tarifa? Envíanos un
        mensaje.
      </p>
      <form id="cfForm" novalidate>
        <div class="cf-field">
          <label class="cf-label" for="cfName" id="cfNameLabel">Nombre</label>
          <input
            class="cf-input"
            id="cfName"
            name="name"
            type="text"
            placeholder="Ada Lovelace"
            autocomplete="name"
            required
          />
        </div>
        <div class="cf-field">
          <label class="cf-label" for="cfEmail" id="cfEmailLabel"
            >Correo electrónico</label
          >
          <input
            class="cf-input"
            id="cfEmail"
            name="email"
            type="email"
            placeholder="ada@ejemplo.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="cf-field">
          <label class="cf-label" for="cfIntent" id="cfIntentLabel"
            >Asunto</label
          >
          <select class="cf-select" id="cfIntent" name="intent">
            <option value="General" id="optGeneral">Consulta general</option>
            <option value="Data correction" id="optData">
              Corrección de datos
            </option>
            <option value="Bug report" id="optBug">Informe de un error</option>
            <option value="API access" id="optApi">Acceso a la API</option>
          </select>
        </div>
        <!-- Honeypot: humans never see or fill this; bots do -->
        <div class="cf-field cf-hp" aria-hidden="true">
          <label for="cfHp">Website</label>
          <input
            id="cfHp"
            name="company_website"
            type="text"
            tabindex="-1"
            autocomplete="off"
          />
        </div>
        <div class="cf-field">
          <label class="cf-label" for="cfMsg" id="cfMsgLabel">Mensaje</label>
          <textarea
            class="cf-textarea"
            id="cfMsg"
            name="message"
            placeholder="Cuéntanos en qué podemos ayudarte."
            required
          ></textarea>
        </div>
        <button class="cf-submit" type="submit" id="cfSubmit">
          Enviar mensaje
        </button>
        <p class="cf-status" id="cfStatus" role="status"></p>
      </form>
    </div>
    <div class="cf-done" id="cfDone">
      <div class="cf-done-icon" aria-hidden="true">&#10003;</div>
      <h2 id="cfDoneTitle">Mensaje recibido</h2>
      <p id="cfDoneBody">
        Gracias por escribirnos. Revisaremos tu mensaje y te responderemos en
        los próximos días.
      </p>
    </div>
    <script>
      (function () {
        var COPY = {
          es: {
            title: "Contacto | Elemetric",
            intro:
              "¿Dudas sobre los datos, acceso a la API o alguna tarifa? Envíanos un mensaje.",
            nameLabel: "Nombre",
            namePlaceholder: "Tu nombre",
            emailLabel: "Correo electrónico",
            emailPlaceholder: "tu@correo.com",
            intentLabel: "Asunto",
            optGeneral: "Consulta general",
            optData: "Corrección de datos",
            optBug: "Informe de un error",
            optApi: "Acceso a la API",
            msgLabel: "Mensaje",
            msgPlaceholder: "Cuéntanos en qué podemos ayudarte.",
            submit: "Enviar mensaje",
            sending: "Enviando...",
            doneTitle: "Mensaje recibido",
            doneBody:
              "Gracias por escribirnos. Revisaremos tu mensaje y te responderemos en los próximos días.",
            errUnreachable:
              "No se pudo enviar el mensaje. Inténtalo de nuevo en unos instantes.",
          },
          en: {
            title: "Contact | Elemetric",
            intro:
              "Questions about the data, API access, or a tariff? Send us a message.",
            nameLabel: "Name",
            namePlaceholder: "Your name",
            emailLabel: "Email",
            emailPlaceholder: "you@example.com",
            intentLabel: "Topic",
            optGeneral: "General question",
            optData: "Data correction",
            optBug: "Bug report",
            optApi: "API access",
            msgLabel: "Message",
            msgPlaceholder: "Tell us how we can help.",
            submit: "Send message",
            sending: "Sending...",
            doneTitle: "Message received",
            doneBody:
              "Thanks for reaching out. We will review your message and reply within a few days.",
            errUnreachable:
              "Could not send your message. Please try again shortly.",
          },
        };

        var params = new URLSearchParams(window.location.search);
        var rawLang = (
          params.get("lang") ||
          navigator.language ||
          "es"
        ).toLowerCase();
        var lang = rawLang.indexOf("en") === 0 ? "en" : "es";
        var t = COPY[lang];

        document.documentElement.lang = lang;
        document.title = t.title;
        document.getElementById("cfIntro").textContent = t.intro;
        document.getElementById("cfNameLabel").textContent = t.nameLabel;
        document.getElementById("cfName").placeholder = t.namePlaceholder;
        document.getElementById("cfEmailLabel").textContent = t.emailLabel;
        document.getElementById("cfEmail").placeholder = t.emailPlaceholder;
        document.getElementById("cfIntentLabel").textContent = t.intentLabel;
        document.getElementById("optGeneral").textContent = t.optGeneral;
        document.getElementById("optData").textContent = t.optData;
        document.getElementById("optBug").textContent = t.optBug;
        document.getElementById("optApi").textContent = t.optApi;
        document.getElementById("cfMsgLabel").textContent = t.msgLabel;
        document.getElementById("cfMsg").placeholder = t.msgPlaceholder;
        document.getElementById("cfSubmit").textContent = t.submit;
        document.getElementById("cfDoneTitle").textContent = t.doneTitle;
        document.getElementById("cfDoneBody").textContent = t.doneBody;

        var form = document.getElementById("cfForm");
        var nameInput = document.getElementById("cfName");
        var emailInput = document.getElementById("cfEmail");
        var intentInput = document.getElementById("cfIntent");
        var msgInput = document.getElementById("cfMsg");
        var hpInput = document.getElementById("cfHp");
        var btn = document.getElementById("cfSubmit");
        var status = document.getElementById("cfStatus");
        var done = document.getElementById("cfDone");

        function showDone() {
          document.getElementById("cfWrap").style.display = "none";
          done.classList.add("visible");
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          if (hpInput.value !== "") {
            showDone();
            return;
          }
          if (
            !nameInput.checkValidity() ||
            !emailInput.checkValidity() ||
            !msgInput.checkValidity()
          ) {
            [nameInput, emailInput, msgInput].forEach(function (f) {
              if (!f.checkValidity()) f.reportValidity();
            });
            return;
          }
          btn.disabled = true;
          btn.textContent = t.sending;
          status.className = "cf-status";
          try {
            var res = await fetch(
              "https://comtomengineering-serverless.vercel.app/api/contact",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  name: nameInput.value.trim(),
                  email: emailInput.value.trim(),
                  intent: "Elemetric — " + intentInput.value,
                  message:
                    msgInput.value.trim() +
                    "\n\n---\nSent from Elemetric (" +
                    window.location.host +
                    ")",
                }),
              },
            );
            if (!res.ok) throw new Error("HTTP " + res.status);
            showDone();
          } catch (err) {
            status.classList.add("visible", "err");
            status.textContent = "\u26A0 " + t.errUnreachable;
          } finally {
            btn.disabled = false;
            btn.textContent = t.submit;
          }
        });
      })();
    </script>
  </body>
</html>
